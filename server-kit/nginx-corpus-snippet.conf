# ============================================================
# Lawu-2.5-Fine — Nginx snippet untuk Corpus + Ebook API (:3002)
# Include di server block utama Lawu:
#
#   include /etc/nginx/snippets/nginx-corpus-snippet.conf;
#   include /etc/nginx/snippets/nginx-training-snippet.conf;
# ============================================================

# ---- Corpus & Ebook (lawu-corpus :3002) ----
location /api/corpus/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}

location /api/ebooks {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
    client_max_body_size 512m;
}

# ---- Training Management (lawu-training :3006) [v3.7.0] ----
location /api/training/ {
    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    # Upload dokumen bisa besar (multipart, sampai 500 MB) — naikkan timeout.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 512m;
    proxy_buffering off;
}
