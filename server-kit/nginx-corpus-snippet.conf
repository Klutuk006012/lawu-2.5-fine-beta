# ============================================================
# nginx snippet — tambahkan DI DALAM server { } lawu-dashboard
# Lokasi di srv-fine: /etc/nginx/sites-available/lawu-dashboard
# Taruh sebelum location / yang sudah ada (atau di mana saja,
# nginx pakai match location terpanjang, bukan urutan).
# ============================================================

# ---- Corpus & Ebook API (Axum :3002) ----
location /api/corpus/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}

location /api/ebooks {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 500M;   # upload ebook via UI
    proxy_read_timeout 300s;
    proxy_request_buffering off; # stream file besar langsung ke disk
}
